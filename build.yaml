targets:
  $default:
    builders:
      module_core_generator|module_core_builder:
        generate_for:
          - test/*
          - test/build/*
builders:
  module_core_builder:
    import: "package:module_core_generator/module_core_builder.dart"
    builder_factories: ["moduleCoreBuilder"]
    build_extensions: {".dart": [".g.dart"]}
    auto_apply: dependents
    build_to: source